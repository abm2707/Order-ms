server:
  port: 8081

spring:
  application:
    name: order-service
  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    org.apache.kafka: ERROR
    kafka: ERROR
    org.springframework.kafka: ERROR

security:
  jwt:
    secret: very-secret-key-change-this-in-prod-1234567890
    expiration: 3600000

kafka:
  bootstrap-servers: localhost:9092
  auto-startup: false
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.trusted.packages: "org.akhil.common.events"

inventory:
  base-url: http://localhost:9090/inventory

reconciliation:
  batch-size: 50
  max-attempts: 5
  sla:
    PENDING: PT2M
    PAYMENT_PENDING: PT10M



